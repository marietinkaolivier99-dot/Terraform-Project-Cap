name: Terraform
# terraform workflow for GitHub Actions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to target"
        required: true
        type: choice
        options: [dev, qa, prod]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: af-south-1
  TF_VERSION: "1.10"

permissions:
  contents: read

jobs:
  fmt:
    name: Format & validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    name: Plan (${{ matrix.env }})
    if: github.event_name == 'pull_request'
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, qa, prod]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=envs/${{ matrix.env }}/${{ matrix.env }}.tfbackend

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=envs/${{ matrix.env }}/${{ matrix.env }}.tfvars \
            -out=tfplan \
            -no-color
          terraform show -no-color tfplan > plan_output.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8').slice(0, 60000);
            const marker = `<!-- terraform-plan-${{ matrix.env }} -->`;
            const body = `${marker}\n### Terraform plan — \`${{ matrix.env }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: Apply (${{ matrix.env }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, qa, prod]
    environment: ${{ matrix.env }}
    concurrency:
      group: terraform-apply-${{ matrix.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=envs/${{ matrix.env }}/${{ matrix.env }}.tfbackend

      - name: Apply
        run: |
          terraform apply \
            -var-file=envs/${{ matrix.env }}/${{ matrix.env }}.tfvars \
            -auto-approve \
            -no-color

  manual:
    name: Manual ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: terraform-apply-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=envs/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfbackend

      - name: Run
        run: |
          case "${{ github.event.inputs.action }}" in
            plan)
              terraform plan -var-file=envs/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars -no-color
              ;;
            apply)
              terraform apply -var-file=envs/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars -auto-approve -no-color
              ;;
            destroy)
              terraform destroy -var-file=envs/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars -auto-approve -no-color
              ;;
          esac
  destroy-all:
    name: Destroy All Environments
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, qa, prod]
    environment: ${{ matrix.env }}
    concurrency:
      group: terraform-destroy-${{ matrix.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=envs/${{ matrix.env }}/${{ matrix.env }}.tfbackend

      - name: Destroy (${{ matrix.env }})
        run: |
          terraform destroy \
            -var-file=envs/${{ matrix.env }}/${{ matrix.env }}.tfvars \
            -auto-approve \
            -no-color